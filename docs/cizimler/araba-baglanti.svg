<text x="40" y="613" text-anchor="start" font-size="12.5" fill="#212121">• L298N üzerindeki ENA / ENB jumper'ları çıkarılmış olmalı; yoksa PWM ile hız kontrolü çalışmaz.</text>
<text x="40" y="632" text-anchor="start" font-size="12.5" fill="#212121">• nRF24 VCC yalnızca 3,3 V — 5 V verilirse modül yanar. 100 µF kondansatör modülün hemen dibine, VCC–GND arasına paralel bağlanır.</text>
<text x="40" y="651" text-anchor="start" font-size="12.5" fill="#212121">• Motorlar ve lojik ayrı pilden beslenir; iki pilin eksi uçları, L298N GND ve Uno GND tek noktada birleşir (ortak GND).</text>
<text x="40" y="670" text-anchor="start" font-size="12.5" fill="#212121">• Bluetooth (HC-05) sürümünde pinler farklıdır: ayrıntı docs/elektrik.md içinde.</text>
